name: ImmortalWrt-Airoha

run-name: "${{ inputs.device == 'all' && '全部机型' || inputs.device == 'xg-040g-mf' && 'XG-040G-MF' || inputs.device == 'xg-040g-tf' && 'XG-040G-TF' || inputs.device == 'zn504xg-d' && 'ZN504XG-D' || inputs.device == 'hg5382a' && 'HG5382A' || 'XG-040G-MD' }} · ${{ inputs.repo_branch || 'master-airoha' }} · ${{ inputs.dram_size == 'auto' && '自适应内存' || inputs.dram_size }} · ${{ inputs.device_variant }}${{ inputs.extra_packages != '' && ' · 有附加包' || '' }}${{ inputs.pkg_versions != '' && ' · 指定版本' || '' }}${{ inputs.release == 'prerelease' && ' · pre-release' || inputs.release == 'artifact' && ' · 不发布' || '' }}"

on:
  workflow_dispatch:
    inputs:
      repo_branch:
        description: '源码分支（Loong1996/immortalwrt）。留空即 master-airoha'
        required: false
        default: 'master-airoha'
        type: string
      device:
        description: '机型'
        required: true
        default: 'xg-040g-tf'
        type: choice
        options:
          - all
          - xg-040g-md
          - xg-040g-mf
          - xg-040g-tf
          - zn504xg-d
          - hg5382a
      device_variant:
        description: '设备变体（ubi 推荐）'
        required: true
        default: 'ubi'
        type: choice
        options:
          - ubi
          - stock
      dram_size:
        description: '内存上限'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - 512M
          - 1G
          - 2G
      extra_packages:
        description: '附加软件包（空格分隔，例如：luci-app-daed luci-i18n-daed-zh-cn）'
        required: false
        default: 'luci-app-daed luci-i18n-daed-zh-cn'
        type: string
      pkg_versions:
        description: '指定软件包版本（实验性）'
        required: false
        default: ''
        type: string
      release:
        description: '发布方式'
        required: true
        default: 'artifact'
        type: choice
        options:
          - auto
          - prerelease
          - artifact
      release_label:
        description: '发布标注（可选）'
        required: false
        default: ''
        type: string

env:
  DRAM_SIZE: ${{ github.event.inputs.dram_size }}
  DEVICE_VARIANT: ${{ github.event.inputs.device_variant }}
  EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}
  PKG_VERSIONS: ${{ github.event.inputs.pkg_versions }}
  REPO_URL: https://github.com/Loong1996/immortalwrt.git
  REPO_BRANCH: ${{ github.event.inputs.repo_branch || 'master-airoha' }}
  DEVICE_TARGET: airoha
  DEVICE_SUBTARGET: an7581
  CONFIG_FILE: config/xg-040g-md-master.config
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  RELEASE_MODE: ${{ github.event.inputs.release || 'artifact' }}
  TZ: Asia/Shanghai

jobs:
  Build:
    name: ${{ matrix.device }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.device != 'all' && format('["{0}"]', inputs.device) || inputs.device_variant == 'stock' && '["xg-040g-md","xg-040g-mf"]' || '["xg-040g-md","xg-040g-mf","xg-040g-tf","zn504xg-d","hg5382a"]') }}
    env:
      DEVICE: ${{ matrix.device }}
    permissions:
      contents: write

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "警告⚠ 分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        free -h
        echo "--------------------------硬盘信息--------------------------"
        df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 不要删除 sources.list.d，只清理缓存
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

        # 确保 universe 源开启（很多开发包在这里）
        sudo apt-get update -y
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y universe
        sudo apt-get update -y

        # 安装编译所需依赖（精简且兼容 Ubuntu 24.04）
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git \
          libncurses-dev libssl-dev python3-setuptools \
          rsync swig unzip zlib1g-dev file wget curl \
          ccache cmake ninja-build pkg-config \
          libelf-dev libglib2.0-dev libgmp-dev liblzo2-dev \
          device-tree-compiler squashfs-tools genisoimage \
          python3 python3-dev python3-pip \
          qemu-utils subversion uglifyjs xmlto xxd dos2unix \
          p7zip-full patch help2man libfuse-dev

        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks(合并磁盘)
      uses: easimon/maximize-build-space@v10
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone Source Code(克隆源代码)
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV

    - name: Generate Variables(生成变量)
      run: |
        case "$DEVICE" in
          xg-040g-mf)
            DEVICE_SUBTARGET=an7583
            MODEL_TAG=XG-040G-MF
            CONFIG_FILE=config/xg-040g-mf-master.config
            ;;
          xg-040g-md)
            DEVICE_SUBTARGET=an7581
            MODEL_TAG=XG-040G-MD
            CONFIG_FILE=config/xg-040g-md-master.config
            ;;
          xg-040g-tf)
            DEVICE_SUBTARGET=an7581
            MODEL_TAG=XG-040G-TF
            CONFIG_FILE=config/xg-040g-tf-master.config
            ;;
          zn504xg-d)
            DEVICE_SUBTARGET=an7581
            MODEL_TAG=ZN504XG-D
            CONFIG_FILE=config/zn504xg-d-master.config
            ;;
          hg5382a)
            DEVICE_SUBTARGET=an7581
            MODEL_TAG=HG5382A
            CONFIG_FILE=config/hg5382a-master.config
            ;;
          *) echo "::error::不支持的 device=$DEVICE"; exit 1 ;;
        esac

        case "$DEVICE" in
          xg-040g-tf|zn504xg-d|hg5382a)
            [ "$DEVICE_VARIANT" = "ubi" ] || { echo "::error::$DEVICE 只有 ubi 布局"; exit 1; }
            ;;
        esac

        case "$DEVICE" in
          xg-040g-tf)   DEVICE_SYMBOL=nokia_${DEVICE}-ubi ;;
          zn504xg-d)    DEVICE_SYMBOL=znxt_${DEVICE}-ubi ;;
          hg5382a)      DEVICE_SYMBOL=fiberhome_${DEVICE}-ubi ;;
          *)
            if [ "$DEVICE_VARIANT" = "stock" ]; then
              DEVICE_SYMBOL=nokia_${DEVICE}
            else
              DEVICE_SYMBOL=nokia_${DEVICE}-ubi
            fi
            ;;
        esac

        echo "CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV
        echo "DEVICE_SYMBOL=$DEVICE_SYMBOL" >> $GITHUB_ENV
        echo "MODEL_TAG=$MODEL_TAG" >> $GITHUB_ENV
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        echo "FLAVOR=$DEVICE_VARIANT" >> $GITHUB_ENV
        echo "VARIANT_LABEL=$DEVICE_VARIANT" >> $GITHUB_ENV
        echo "RELEASE_TAG=${MODEL_TAG}-${DEVICE_VARIANT}-$DRAM_SIZE-$(date +"%Y%m%d")-${{ github.run_number }}" >> $GITHUB_ENV

        if [ "$DRAM_SIZE" = "auto" ]; then
          echo "DRAM_LABEL=自适应" >> $GITHUB_ENV
        else
          echo "DRAM_LABEL=$DRAM_SIZE" >> $GITHUB_ENV
        fi

        echo "使用配置: $CONFIG_FILE    设备: $DEVICE_SYMBOL"

    - name: Install Feeds(安装feeds)
      run: |
        cd $OPENWRT_PATH
        [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
        grep -q "^src-link loong " feeds.conf || \
          echo "src-link loong $GITHUB_WORKSPACE/packages" >> feeds.conf
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration(加载自定义配置)
      run: |
        cd $OPENWRT_PATH
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config

        # 处理附加软件包
        if [ -n "$EXTRA_PACKAGES" ]; then
          for pkg in $EXTRA_PACKAGES; do
            if [[ "$pkg" == -* ]]; then
              echo "CONFIG_PACKAGE_${pkg#-}=n" >> .config
            else
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
            fi
          done
        fi

        make defconfig

    - name: Download Package(下载软件包)
      run: |
        cd $OPENWRT_PATH
        make download -j$(nproc) || make download -j1 V=s

    - name: Compile Firmware(编译固件)
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo "开始编译..."
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FIRMWARE_PATH=$OPENWRT_PATH/bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET" >> $GITHUB_ENV

    - name: Organize Files(整理文件)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $FIRMWARE_PATH
        mkdir -p $GITHUB_WORKSPACE/firmware
        cp -rf * $GITHUB_WORKSPACE/firmware/ || true
        echo "整理完成"

    - name: Upload Firmware To Artifact(上传固件)
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_TAG }}
        path: ${{ env.FIRMWARE_PATH }}
        retention-days: 30
